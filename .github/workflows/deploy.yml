name: Deploy to Cloudflare

# Every push to main rebuilds dist/ and deploys it with Wrangler.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID  the account id shown by `npx wrangler whoami`
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#                          at https://dash.cloudflare.com/profile/api-tokens

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check secrets are configured
        run: |
          ok=true
          [ "$HAS_ACCOUNT" = "true" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing."; ok=false; }
          [ "$HAS_TOKEN" = "true" ]   || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing. Create one from the 'Edit Cloudflare Workers' template at https://dash.cloudflare.com/profile/api-tokens and add it under Settings → Secrets and variables → Actions."; ok=false; }
          $ok

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dist/
        run: ./build.sh

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
